---
layout: default
---

<div class="posts-list">
  {%- for post in site.posts -%}
    <article class="post-item">
      <time class="post-item__date" datetime="{{ post.date | date_to_xmlschema }}">
        {{ post.date | date: "%d de %B, %Y" }}
      </time>
      <h2 class="post-item__title">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </h2>
      <p class="post-item__excerpt">
        {{ post.content | strip_html | truncatewords: 40 }}
      </p>
      <a class="post-item__readmore" href="{{ post.url | relative_url }}">
        Seguir leyendo →
      </a>
    </article>
  {%- else -%}
    <p class="empty-state">Todavía no hay publicaciones.</p>
  {%- endfor -%}
</div>
