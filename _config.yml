# ---------------------------------------------------------------
# Flujo Libre — Minimal Mistakes configuration
# Theme docs: https://mmistakes.github.io/minimal-mistakes/docs/configuration/
# ---------------------------------------------------------------

# Remote theme (works on GitHub Pages + GH Actions)
remote_theme: "mmistakes/minimal-mistakes@4.26.2"

# Skin: air = light blues, clean (aquatic feel)
minimal_mistakes_skin: "air"

# Site identity
locale:          "es-CO"
title:           "Flujo Libre"
title_separator: "-"
subtitle:        "Blog personal de Fabio Amador"
name:            "Fabio Amador"
description:     >-
  Reflexiones sobre el agua, la ingeniería y la literatura.
  Un blog personal de Fabio Amador.

url:      "https://abarcuo.github.io"
baseurl:  ""
repository: "abarcuo/abarcuo.github.io"
words_per_minute: 200

# Search (built-in MM client-side)
search:              true
search_full_content: true
search_provider:     lunr
lunr:
  search_within_pages: true

# Comments, feed
comments:
  provider: false
atom_feed:
  hide: false

# SEO / social
twitter:
  username: ""
social:
  type:   Person
  name:   "Fabio Amador"
  links:
    - "https://www.linkedin.com/in/fabio-amador-713576234/"

# Author profile (sidebar on posts + bio on about)
author:
  name:   "Fabio Amador"
  avatar: "/Pictures/Perfil.jpeg"
  bio:    "Ingeniero Civil. Apasionado por el agua y la literatura."
  location: "Bogotá, Colombia"
  #email:  "fabioama@hotmail.com"
  links:
    - #label: "Email"
      #icon:  "fas fa-fw fa-envelope-square"
      #url:   "mailto:fabioama@hotmail.com"
    - label: "LinkedIn"
      icon:  "fab fa-fw fa-linkedin"
      url:   "https://www.linkedin.com/in/fabio-amador-713576234/"
    - label: "Instagram"
      icon:  "fab fa-fw fa-instagram"
      url:   "https://www.instagram.com/abarcuo/"

# Footer links
footer:
  links:
    - #label: "Email"
      #icon:  "fas fa-fw fa-envelope-square"
      #url:   "mailto:fabioama@hotmail.com"
    - label: ""
      icon:  "fab fa-fw fa-linkedin"
      url:   "https://www.linkedin.com/in/fabio-amador-713576234/"
    - label: ""
      icon:  "fab fa-fw fa-instagram"
      url:   "https://www.instagram.com/abarcuo/"

# Reading files / collections
include:
  - _pages

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "package*.json"
  - purgecss.js
  - rollup.config.js
  - preview.html

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-remote-theme

# Archives (MM built-in)
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Pagination
paginate: 10
paginate_path: /page:num/

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Defaults
defaults:
  # Posts: sidebar con autor, read time, relacionados
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
      show_date: true
      toc: false
      permalink: /posts/:title/

  # Páginas de _pages (about, etc.)
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

# Timezone
timezone: America/Bogota
