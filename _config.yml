# ---------------------------------------------------------------
# Flujo Libre — Site configuration
# ---------------------------------------------------------------

# Site identity
title:       Flujo Libre
tagline:     Blog personal de Fabio Amador
description: >-
  Reflexiones sobre el agua, la ingeniería, la historia y la literatura.
  Un blog personal de Fabio Amador.

author:
  name:  Fabio Amador
  email: fabioama@hotmail.com

# Language & timezone
lang:     es-CO
timezone: America/Bogota

# URL
url:     "https://abarcuo.github.io"
baseurl: ""

# Avatar (used on about/footer if desired)
avatar: https://media.licdn.com/dms/image/v2/D4E03AQEo9w2kXufdvw/profile-displayphoto-shrink_800_800/B4EZTMlb..G0Ag-/0/1738599155399?e=1745452800&v=beta&t=M-2tn4r7kn3CENq-owyKkW0TMkbf_kiQvVIDtyPhcYA

# Social
github:
  username: abarcuo

social:
  name:  Fabio Amador
  email: fabioama@hotmail.com
  links:
    - https://www.linkedin.com/in/fabio-amador-713576234/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-archives

# Pagination
paginate: 10

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

# Sass
sass:
  style: compressed
  sass_dir: _sass

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Archives
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive
    tag: archive
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Excludes
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "package*.json"
  - purgecss.js
  - rollup.config.js

# SEO / site-wide image (optional)
social_preview_image:
