<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {%- if page.title -%}
    <title>{{ page.title }} · {{ site.title }}</title>
  {%- else -%}
    <title>{{ site.title }} — {{ site.tagline }}</title>
  {%- endif -%}

  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.social.name }}">

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:locale" content="{{ site.lang | replace: '-', '_' | default: 'es_ES' }}">
  {%- if site.url -%}
    <meta property="og:url" content="{{ page.url | absolute_url }}">
  {%- endif -%}

  <meta name="twitter:card" content="summary">

  <!-- Favicon (water drop emoji) -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💧</text></svg>'>

  <!-- Feed -->
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">

  <!-- Canonical -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Fonts: PT Serif + PT Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
